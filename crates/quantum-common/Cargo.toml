[package]
name        = "quantum-common"
version     = "0.0.0-dev"
edition     = "2021"
license     = "Apache-2.0"
description = "Quantum common — no_std helpers shared across Quantum PIC modules and host consumers"

[lib]
name = "quantum_common"
path = "src/lib.rs"

# Path layout per standards/dependencies.md §9: `common/` is a
# symlink to `../../modules/common`. Cargo follows it at package
# time so the published `.crate` tarball is self-contained;
# source-of-truth stays at `modules/common/*.rs`, which PIC modules
# `#[path]`-include directly. `[project].version` in fluxor.toml is
# the version of record for this crate's publish.
#
# fluxor-abi is consumed from the local fluxor registry, bootstrapped
# by `fluxor registry setup-cargo` on the developer's machine.
[dependencies]
fluxor-abi = { version = "0.0.1", registry = "fluxor" }

# Inline lints rather than `workspace = true`: the bundled common
# files carry alignment-driven `unsafe` and pedantic-relaxed
# patterns that match the PIC build's relaxed baseline, which the
# host-tools-tuned workspace baseline would over-tighten.
[lints.rust]
unsafe_code     = "allow"
unused_must_use = "deny"

[lints.clippy]
all      = { level = "deny",  priority = -1 }
pedantic = { level = "allow", priority = -1 }
