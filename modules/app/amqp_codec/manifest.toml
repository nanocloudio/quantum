version = "0.1.0"
type             = "Transformer"
entry            = "mod.rs"
hardware_targets = ["bcm2712"]

[[ports]]
name = "raw_in"
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "responses_in"
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "proposals_out"
direction = "output"
content_type = "OctetStream"

[[ports]]
name = "frames_out"
direction = "output"
content_type = "OctetStream"

[observability]
metrics = ["bytes_in", "bytes_out", "frames_decoded", "frames_encoded", "parse_errors"]
