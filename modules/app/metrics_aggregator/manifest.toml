version = "0.1.0"
type             = "Transformer"
entry            = "mod.rs"
hardware_targets = ["bcm2712"]

[[ports]]
name = "ingest"
direction = "input"
content_type = "OctetStream"
[[ports]]
name = "rollups"
direction = "output"
content_type = "OctetStream"

[observability]
metrics = [
    "bytes_in",
    "bytes_out",
    "metrics_ingested",
    "rollups_emitted",
    "cardinality_active",
    "storm_drops",
]
