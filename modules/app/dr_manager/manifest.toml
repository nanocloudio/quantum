version = "0.1.0"
type             = "Transformer"
entry            = "mod.rs"
hardware_targets = ["bcm2712"]

[[ports]]
name = "wal_signal_in"
direction = "input"
content_type = "OctetStream"
[[ports]]
name = "snapshot_resp_in"
direction = "input"
content_type = "OctetStream"
[[ports]]
name = "promotion_req_in"
direction = "input"
content_type = "OctetStream"
[[ports]]
name = "snapshot_req"
direction = "output"
content_type = "OctetStream"
[[ports]]
name = "promotion"
direction = "output"
content_type = "OctetStream"
[[ports]]
name = "audit_events"
direction = "output"
content_type = "OctetStream"
[[ports]]
name = "metrics"
direction = "output"
content_type = "OctetStream"

[observability]
metrics = [
    "bytes_in",
    "bytes_out",
    "checkpoints_exported",
    "wal_archived",
    "replication_lag_seconds",
    "promotions",
]
