version = "0.1.0"
type             = "Transformer"
entry            = "mod.rs"
hardware_targets = ["bcm2712"]

[[ports]]
name = "durability_in"
direction = "input"
content_type = "OctetStream"
[[ports]]
name = "register_in"
direction = "input"
content_type = "OctetStream"
[[ports]]
name = "ack_out"
direction = "output"
content_type = "OctetStream"
[[ports]]
name = "redeliver_out"
direction = "output"
content_type = "OctetStream"
[[ports]]
name = "metrics"
direction = "output"
content_type = "OctetStream"

[observability]
metrics = [
    "bytes_in",
    "bytes_out",
    "acks_emitted",
    "redeliveries",
    "inflight_timeouts",
    "inflight_active",
]
