version          = "0.1.0"
type             = "Protocol"
timer_class      = "wall_clock"
entry            = "mod.rs"
hardware_targets = ["bcm2712", "linux"]

# mqtt_sink — MQTT 5 QoS 1 PRODUCER (MQTT 3.1.1 to a broker that refuses
# version 5), a PROVIDER of the exchange contract
# (`target/fluxor/fluxor-abi/sdk/contracts/exchange.rs`). Any graph that
# publishes durably composes it by deployment pin; quantum knows nothing
# about who publishes. The broker is any MQTT broker: quantum's own, or a
# foreign one (mosquitto, …).
#
# Request: METHOD_PUBLISH; `target` = the ordering key (up to KEY_MAX);
# body = the record, published as the MQTT payload byte for byte on the
# configured `topic`; flags MORE and BROADCAST only. Anything else is
# answered 400.
#
# Answer: 200 with an empty body once the broker PUBACKs (QoS 1); 503
# when every collecting slot is taken, or when an MQTT 5 broker's PUBACK
# says Quota exceeded; 502 for any other MQTT 5 PUBACK failure reason.
# Losing the broker connection writes LINK DOWN; the next CONNACK writes
# LINK UP, and the requester re-issues every exchange it held open.
#
# Size is bounded by the broker connected to, not by this module. 413
# answers a record
#   - past `max_payload`, what the contract collects;
#   - whose PUBLISH would pass the Maximum Packet Size the broker
#     advertised in its MQTT 5 CONNACK — refused before it is sent
#     (quantum's broker advertises what one Raft entry commits);
#   - the broker ended the connection for: the largest publish awaiting
#     PUBACK when an MQTT 5 broker sends DISCONNECT with Packet too large
#     (0x95); or, from a broker that only closes (all MQTT 3.1.1 offers),
#     a record larger than any PUBACKed on the connection that the
#     connection closes on twice — the first close is a LINK DOWN, and
#     the second, on its re-issue, is taken as the broker's refusal.
# Every other publish awaiting PUBACK is invalidated by the LINK DOWN
# and re-issued after the LINK UP. A broker that advertises no maximum is
# sent records up to `max_payload`.
#
# Delivery terms (`stream.ordered_ack`):
#   ack       — 200 is durable acceptance: PUBACK at QoS 1, which
#               quantum's broker gates on Clustor durability proofs.
#   ordering  — one TCP connection, one topic, serialized sends:
#               request order IS broker order.
#   no silent drops — every exchange is PUBACK-answered, refused, or
#               invalidated by LINK DOWN on connection loss.
#   backpressure — `request_in` is read only while connected with
#               in-flight window room.
#   broadcast — a single MQTT topic is ONE ordering unit, so BROADCAST
#               is a plain publish.
capabilities = ["stream.ordered_ack.sink"]

# `max_payload` is the largest record this module carries: the contract's
# collected-body ceiling, which the PUBLISH buffer is sized to hold. A
# requester declaring a larger one fails the build. The broker connected
# to may take less (above), which only it can say, at run time.
[capability_facts."stream.ordered_ack.sink"]
ack        = "durable"
ordering   = "single"
broadcast  = "degenerate"
max_payload = 8192

# in[0]/out[0]: net_proto to the IP module (TCP client to the broker).
[[ports]]
name = "net_in"
direction = "input"
content_type = "NetProto"
buffer_size = 16384
max_record = 1600

[[ports]]
name = "net_out"
direction = "output"
content_type = "NetProto"
buffer_size = 16384
max_record = 1600

# in[1]: exchange request records — PUBLISH exchanges to answer.
[[ports]]
name = "request_in"
index = 1
direction = "input"
content_type = "ExchangeRequest"
buffer_size = 32768
max_record = 8192

# out[1]: exchange response records — one answer per exchange, and LINK.
[[ports]]
name = "response_out"
index = 1
direction = "output"
content_type = "ExchangeResponse"
buffer_size = 4096
max_record = 8192

[observability]
exempt = "byte counters ride the shared telemetry ring like mqtt_client; module-scope metric ids arrive with the metrics port in a later slice"
