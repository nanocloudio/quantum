version = "0.1.0"
type             = "Transformer"
entry            = "mod.rs"
hardware_targets = ["bcm2712"]

[[ports]]
name = "forward_in"
direction = "input"
content_type = "OctetStream"
[[ports]]
name = "replay_in"
direction = "input"
content_type = "OctetStream"
[[ports]]
name = "local_out"
direction = "output"
content_type = "OctetStream"
[[ports]]
name = "remote_out"
direction = "output"
content_type = "OctetStream"
[[ports]]
name = "wal_marker"
direction = "output"
content_type = "OctetStream"
[[ports]]
name = "metrics"
direction = "output"
content_type = "OctetStream"

[observability]
metrics = ["bytes_in", "bytes_out", "forwards_sent", "forward_acks", "forward_timeouts", "inflight_forwards"]
