version = "0.1.0"
type             = "Transformer"
entry            = "mod.rs"
hardware_targets = ["bcm2712"]

[[ports]]
name = "op_in"
direction = "input"
content_type = "OctetStream"

# Control-plane placement: `MSG_PLACEMENT_UPDATE` carrying the routing
# epoch and, optionally, the partition count and this node's PRG.
# Optional — an unwired engine keeps the single-PRG defaults.
[[ports]]
name = "routing_in"
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "deliver_out"
direction = "output"
content_type = "OctetStream"
[[ports]]
name = "metrics"
direction = "output"
content_type = "OctetStream"

# Deliveries for subscriptions held by session worker 1 — the standby of
# an anchor-preserved handoff pair (docs/architecture/session_continuity.md).
# A subscription records the worker that holds its session (byte 9 of the
# subscribe record) and `MSG_TOPIC_MOVE` re-points it when the session
# moves; each delivery then goes to exactly one worker. Unwired on a
# one-worker node, where everything goes to `deliver_out`. Declared last:
# the port index is the ABI.
[[ports]]
name = "deliver_out2"
direction = "output"
content_type = "OctetStream"

[observability]
metrics = [
    "bytes_in",
    "bytes_out",
    "subscriptions",
    "publishes_routed",
    "wildcard_matches",
]
