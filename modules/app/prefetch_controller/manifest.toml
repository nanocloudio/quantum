version = "0.1.0"
type             = "Transformer"
entry            = "mod.rs"
hardware_targets = ["bcm2712"]

[[ports]]
name = "lag_in"
direction = "input"
content_type = "OctetStream"
[[ports]]
name = "credits_out"
direction = "output"
content_type = "OctetStream"
[[ports]]
name = "metrics"
direction = "output"
content_type = "OctetStream"

[observability]
metrics = [
    "bytes_in",
    "bytes_out",
    "credits_issued",
    "prefetch_lag",
    "credit_window",
]
