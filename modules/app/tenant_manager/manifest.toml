version = "0.1.0"
type             = "Transformer"
entry            = "mod.rs"
hardware_targets = ["bcm2712"]

[[ports]]
name = "records_in"
direction = "input"
content_type = "OctetStream"
[[ports]]
name = "charge_in"
direction = "input"
content_type = "OctetStream"
[[ports]]
name = "quota_signals"
direction = "output"
content_type = "OctetStream"
[[ports]]
name = "disconnect_events"
direction = "output"
content_type = "OctetStream"
[[ports]]
name = "audit_events"
direction = "output"
content_type = "OctetStream"
[[ports]]
name = "metrics"
direction = "output"
content_type = "OctetStream"

[observability]
metrics = [
    "bytes_in",
    "bytes_out",
    "quota_checks",
    "quota_violations",
    "noisy_neighbor_disconnects",
    "token_bucket_level",
]
