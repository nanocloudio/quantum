version          = "0.1.0"
type             = "Protocol"
timer_class      = "wall_clock"
entry            = "mod.rs"
hardware_targets = ["bcm2712"]

# amqp_sink — AMQP 0-9-1 PUBLISHER, a PROVIDER of the exchange contract
# (`target/fluxor/fluxor-abi/sdk/contracts/exchange.rs`). Sibling of
# mqtt_sink/kafka_sink; any graph that publishes durably composes it by
# deployment pin.
#
# Request: METHOD_PUBLISH; `target` = the ordering key (up to KEY_MAX);
# body = the record, published as the message body byte for byte to the
# default exchange with the configured `topic` as routing key; flags
# MORE and BROADCAST only. Anything else is answered 400.
#
# Answer: 200 with an empty body on the broker's Basic.Ack; 502 on a
# Basic.Nack (the broker would not take the record — quantum's own
# broker nacks a body over its 1800-byte cap); 413 for a record past the
# bounds; 503 when every collecting slot is taken. Losing the broker
# connection writes LINK DOWN; the next Confirm.SelectOk writes LINK UP,
# and the requester re-issues every exchange it held open.
#
# Delivery terms (`stream.ordered_ack`):
#   ack       — 200 is durable acceptance: PUBLISHER CONFIRMS
#               (confirm.select; basic.ack), which quantum's broker
#               gates on Clustor quorum durability.
#   ordering  — one channel, serialized publishes: confirm tags are
#               sequential in request order.
#   no silent drops — every exchange is confirmed, nacked, refused, or
#               invalidated by LINK DOWN.
#   backpressure — `request_in` is read only while connected with
#               confirm-window room (the broker allows at most 8
#               pending publishes per connection).
#   broadcast — one queue is ONE ordering unit, so BROADCAST is a plain
#               publish.
capabilities = ["stream.ordered_ack.sink"]

# `max_payload` is the largest record this module carries: the contract's
# collected-body ceiling, sent as body frames within AMQP's minimum
# frame-max. A broker that caps bodies lower nacks the excess.
[capability_facts."stream.ordered_ack.sink"]
ack        = "durable"
ordering   = "single"
broadcast  = "degenerate"
max_payload = 8192

# in[0]/out[0]: net_proto to the IP module (TCP client to the broker).
[[ports]]
name = "net_in"
direction = "input"
content_type = "NetProto"
buffer_size = 16384
max_record = 1600

[[ports]]
name = "net_out"
direction = "output"
content_type = "NetProto"
buffer_size = 16384
max_record = 1600

# in[1]: exchange request records — PUBLISH exchanges to answer.
[[ports]]
name = "request_in"
index = 1
direction = "input"
content_type = "ExchangeRequest"
buffer_size = 32768
max_record = 8192

# out[1]: exchange response records — one answer per exchange, and LINK.
[[ports]]
name = "response_out"
index = 1
direction = "output"
content_type = "ExchangeResponse"
buffer_size = 4096
max_record = 8192

[observability]
exempt = "byte counters ride the shared telemetry ring like mqtt_sink; module-scope metric ids arrive with the metrics port in a later slice"
