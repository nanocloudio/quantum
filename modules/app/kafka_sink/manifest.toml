version          = "0.1.0"
type             = "Protocol"
timer_class      = "wall_clock"
entry            = "mod.rs"
hardware_targets = ["bcm2712"]

# kafka_sink — Kafka PRODUCER exposing the generic
# `stream.sink.ordered_ack` surface: ordered publishes in, durable acks
# + link-state signals out. Sibling of mqtt_sink/amqp_sink; any
# producer graph composes it by deployment pin. Wire fragment for the
# surface is currently owned by lattice `modules/common/cdc_wire.rs`
# (frames inlined byte-for-byte; that owner's conformance vectors are
# the cross-repo check).
#
# Contract mapping (the surface's terms):
#   term 1  ack = durable acceptance → Produce with acks=-1; this
#           broker emits the ProduceResponse only after quorum
#           durability of every partition in the request.
#   term 2  per-key order in a connection → the message key selects
#           the partition (FNV-1a % partition count) and publishes are
#           serialized, so same-key events land one partition in
#           publish order.
#   term 3  no silent drops → every publish is answered (per-partition
#           error mapped to a typed refusal) or invalidated by
#           LINK_DOWN.
#   term 4  backpressure by channel → publish_in drained only while
#           connected with produce-window room.
#   term 5  broadcast → ONE Produce request naming EVERY partition;
#           the broker acks it only after the SLOWEST partition is
#           durable, which is exactly the surface's broadcast ack.
#
# This is the partitioned-backend validation vehicle: unlike MQTT/AMQP
# (single ordering unit), Kafka genuinely exercises the msg_key
# partition mapping and the broadcast fan-out.
#
# Payload ceiling: this broker caps a partition's records blob at 1900
# bytes; larger payloads get the typed OVERSIZE refusal.

capabilities = ["stream.sink.ordered_ack"]

# in[0]/out[0]: net_proto to the IP module (TCP client to the broker).
[[ports]]
name = "net_in"
direction = "input"
content_type = "NetProto"
buffer_size = 16384
max_record = 1600

[[ports]]
name = "net_out"
direction = "output"
content_type = "NetProto"
buffer_size = 16384
max_record = 1600

# in[1]: MSG_CDC_PUBLISH `SinkPublish` frames from the producer.
[[ports]]
name = "publish_in"
index = 1
direction = "input"
content_type = "OctetStream"
buffer_size = 32768
max_record = 8192

# out[1]: MSG_CDC_ACK `SinkAck` frames (replies + link-state).
[[ports]]
name = "ack_out"
index = 1
direction = "output"
content_type = "OctetStream"

[observability]
exempt = "byte counters ride the shared telemetry ring like mqtt_sink; module-scope metric ids arrive with the metrics port in a later slice"
