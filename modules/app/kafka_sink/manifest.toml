version          = "0.1.0"
type             = "Protocol"
timer_class      = "wall_clock"
entry            = "mod.rs"
hardware_targets = ["bcm2712"]

# kafka_sink — Kafka PRODUCER, a PROVIDER of the exchange contract
# (`target/fluxor/fluxor-abi/sdk/contracts/exchange.rs`). Sibling of
# mqtt_sink/amqp_sink; any graph that publishes durably composes it by
# deployment pin.
#
# Request: METHOD_PUBLISH; `target` = the ordering key (up to KEY_MAX),
# produced as the Kafka record key; body = the record, produced as the
# record value byte for byte to the configured `topic`; flags MORE and
# BROADCAST only. Anything else is answered 400.
#
# Answer: 200 with an empty body once the ProduceResponse reports every
# named partition durable; 413 for a record past the bounds or one the
# broker reports MESSAGE_TOO_LARGE; 502 for any other partition error;
# 503 when every collecting slot is taken. Losing the broker connection
# (or a produce unanswered for 15 s) writes LINK DOWN; the next Metadata
# round trip writes LINK UP, and the requester re-issues every exchange
# it held open.
#
# Delivery terms (`stream.ordered_ack`):
#   ack       — 200 is durable acceptance: Produce with acks=-1; this
#               broker emits the ProduceResponse only after quorum
#               durability of every partition in the request.
#   ordering  — per key: the ordering key selects the partition
#               (FNV-1a % partition count) and produces are serialized,
#               so same-key records land on one partition in request
#               order.
#   no silent drops — every exchange is answered or invalidated by
#               LINK DOWN.
#   backpressure — `request_in` is read only while connected with
#               produce-window room.
#   broadcast — ONE Produce request naming EVERY partition; the broker
#               acks it only after the SLOWEST partition is durable,
#               which is exactly the contract's broadcast answer. A
#               broadcast whose batches do not fit one Produce request
#               (about 12 KiB) is refused with 413.
#
# This is the partitioned-backend validation vehicle: unlike MQTT/AMQP
# (single ordering unit), Kafka genuinely exercises the ordering-key
# partition mapping and the broadcast fan-out.
capabilities = ["stream.ordered_ack.sink"]

# `max_payload` is the largest record value this module carries: the
# contract's collected-body ceiling. The broker's `message.max.bytes`
# must admit one batch of that value with a KEY_MAX key.
[capability_facts."stream.ordered_ack.sink"]
ack        = "durable"
ordering   = "per_key"
broadcast  = "fanout"
max_payload = 8192

# in[0]/out[0]: net_proto to the IP module (TCP client to the broker).
[[ports]]
name = "net_in"
direction = "input"
content_type = "NetProto"
buffer_size = 16384
max_record = 1600

[[ports]]
name = "net_out"
direction = "output"
content_type = "NetProto"
buffer_size = 16384
max_record = 1600

# in[1]: exchange request records — PUBLISH exchanges to answer.
[[ports]]
name = "request_in"
index = 1
direction = "input"
content_type = "ExchangeRequest"
buffer_size = 32768
max_record = 8192

# out[1]: exchange response records — one answer per exchange, and LINK.
[[ports]]
name = "response_out"
index = 1
direction = "output"
content_type = "ExchangeResponse"
buffer_size = 4096
max_record = 8192

[observability]
exempt = "byte counters ride the shared telemetry ring like mqtt_sink; module-scope metric ids arrive with the metrics port in a later slice"
