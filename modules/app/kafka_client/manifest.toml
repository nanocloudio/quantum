version          = "0.1.0"
type             = "Protocol"
entry            = "mod.rs"
hardware_targets = ["bcm2712"]
timer_class      = "wall_clock"

# NetProto pair to the network provider (ip on embedded, linux_net on linux).
[[ports]]
name         = "net_in"
direction    = "input"
content_type = "NetProto"
buffer_size  = 2048

# Reserved for fetch/produce requests; membership needs no input.
[[ports]]
name         = "publish_in"
index        = 1
direction    = "input"
content_type = "OctetStream"
buffer_size  = 2048

[[ports]]
name         = "net_out"
direction    = "output"
content_type = "NetProto"
buffer_size  = 2048
max_record   = 1600

# Membership transitions (joined / stable / lost).
[[ports]]
name         = "status_out"
index        = 1
direction    = "output"
content_type = "TextPlain"
buffer_size  = 2048

[[resources]]
requires_contract = "channel"
access            = "read"

[observability]
exempt = "Kafka consumer-group connector; throughput is observed at the network provider"
