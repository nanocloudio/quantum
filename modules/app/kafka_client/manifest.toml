version          = "0.1.0"
type             = "Protocol"
entry            = "mod.rs"
hardware_targets = ["bcm2712"]
timer_class      = "wall_clock"

# NetProto pair to the network provider (ip on embedded, linux_net on linux).
[[ports]]
name         = "net_in"
direction    = "input"
content_type = "NetProto"
buffer_size  = 2048

# in[1]: exchange request records. In producer mode (`produce_topic` set)
# each PUBLISH exchange is produced to the topic and answered on
# `response_out`; a consumer answers every request 400.
[[ports]]
name         = "request_in"
index        = 1
direction    = "input"
content_type = "ExchangeRequest"
buffer_size  = 16384
max_record   = 8192

[[ports]]
name         = "net_out"
direction    = "output"
content_type = "NetProto"
buffer_size  = 2048
max_record   = 1600

# Membership and produce transitions (joined / stable / lost / produced),
# as human-readable lines.
[[ports]]
name         = "status_out"
index        = 1
direction    = "output"
content_type = "TextPlain"
buffer_size  = 2048

# out[2]: exchange response records — one answer per exchange: 200 with an
# empty body when the partition leader took the record (acks = leader), 413
# for a value past 480 bytes or MESSAGE_TOO_LARGE, 502 for another partition
# error, 400 from a consumer; and LINK DOWN / UP as the broker connection
# drops and returns.
[[ports]]
name         = "response_out"
index        = 2
direction    = "output"
content_type = "ExchangeResponse"
buffer_size  = 4096
max_record   = 8192

[[resources]]
requires_contract = "channel"
access            = "read"

[observability]
# Membership health — the honest observable for a connector whose job is
# JoinGroup/SyncGroup/heartbeat. Consumer-group lag (per partition/group) is
# deliberately ABSENT: it needs committed offsets + high watermarks, i.e. the
# fetch/OffsetFetch protocol this module documents as its follow-on, and a
# fabricated series is worse than none. `membership_stable` is an updown
# gauge (1 = Stable group member).
metrics = ["joins", "heartbeats", "rebalances", "errors", "membership_stable"]

[[observability.instrument]]
name = "membership_stable"
kind = "updown"
