version = "0.2.0"
type             = "Transformer"
entry            = "mod.rs"
hardware_targets = ["bcm2712"]

[[ports]]
name = "raw_in"
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "mqtt_out"
direction = "output"
content_type = "OctetStream"

[[ports]]
name = "kafka_out"
direction = "output"
content_type = "OctetStream"

[[ports]]
name = "amqp_out"
direction = "output"
content_type = "OctetStream"

[[ports]]
name = "http_out"
direction = "output"
content_type = "OctetStream"

[observability]
metrics = ["bytes_in", "bytes_out", "routed_mqtt", "routed_kafka", "routed_amqp", "routed_http"]
