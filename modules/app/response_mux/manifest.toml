version = "0.1.0"
type             = "Transformer"
entry            = "mod.rs"
hardware_targets = ["bcm2712"]

[[ports]]
name = "mqtt_in"
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "kafka_in"
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "amqp_in"
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "http_in"
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "mux_out"
direction = "output"
content_type = "OctetStream"

[observability]
metrics = ["bytes_in", "bytes_out", "responses_muxed", "mux_overflow"]
