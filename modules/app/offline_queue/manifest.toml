version = "0.1.0"
type             = "Transformer"
entry            = "mod.rs"
hardware_targets = ["bcm2712"]

[[ports]]
name = "enqueue_in"
direction = "input"
content_type = "OctetStream"
[[ports]]
name = "reconnect_in"
direction = "input"
content_type = "OctetStream"
[[ports]]
name = "drain_out"
direction = "output"
content_type = "OctetStream"
[[ports]]
name = "metrics"
direction = "output"
content_type = "OctetStream"

[observability]
metrics = ["bytes_in", "bytes_out", "enqueued", "drained", "expired", "queue_depth"]
