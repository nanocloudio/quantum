version = "0.1.0"
type             = "Transformer"
entry            = "mod.rs"
hardware_targets = ["bcm2712"]

[[ports]]
name = "envelope_in"
direction = "input"
content_type = "OctetStream"
[[ports]]
name = "rejected_in"
direction = "input"
content_type = "OctetStream"
[[ports]]
name = "protocol_signals"
direction = "output"
content_type = "OctetStream"
[[ports]]
name = "status"
direction = "output"
content_type = "OctetStream"
[[ports]]
name = "metrics"
direction = "output"
content_type = "OctetStream"

[observability]
metrics = [
    "bytes_in",
    "bytes_out",
    "bp_steps",
    "pause_acks",
    "qos0_drops",
    "queue_depth_commit_apply",
]
