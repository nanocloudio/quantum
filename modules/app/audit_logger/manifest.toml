version = "0.1.0"
type             = "Transformer"
entry            = "mod.rs"
hardware_targets = ["bcm2712"]

[[ports]]
name = "event_in"
direction = "input"
content_type = "OctetStream"
[[ports]]
name = "signed_events"
direction = "output"
content_type = "OctetStream"

[observability]
metrics = [
    "bytes_in",
    "bytes_out",
    "audit_events",
    "signed_records",
    "audit_dropped",
]
