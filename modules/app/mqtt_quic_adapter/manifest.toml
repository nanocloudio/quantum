version = "0.1.0"
type             = "Transformer"
entry            = "mod.rs"
hardware_targets = ["bcm2712"]

# MQTT-over-QUIC adapter. Bridges fluxor's `quic` foundation module to
# quantum's `protocol` module without modifying either side.
#
# Inbound:
#   quic.app_out  → quic_in   — mux-contract frames (session lifecycle,
#                               MSG_MUX_STREAM_ACCEPTED / _RX / _CLOSED,
#                               peer identity, datagrams)
#   quic_in       → mqtt_out  — `[conn_id][mqtt bytes]`, the same shape
#                               `protocol.raw_in` consumes on the TCP path
#
# Outbound (response path):
#   protocol.frames_out → frames_in — envelope-framed MSG_CLIENT_FRAME
#                                     (0xEA) carrying `[conn_id][mqtt bytes]`
#   frames_in           → quic_out  — CMD_MUX_STREAM_SEND on the session's
#                                     MQTT control stream
#
# Both outputs must be wired: `quic_out` carries the response path and
# `mqtt_out` every inbound packet. Leaving `mqtt_out` unwired makes each
# write fail, which presents as a completed QUIC handshake followed by
# silence.
#
# Conn-id namespace: this adapter does NOT remap conn_ids. It is meant
# for QUIC-only graphs (no concurrent peer_router TCP path into the same
# `protocol` instance). A future revision can add a high-bit offset if a
# mixed TCP+QUIC graph needs both transports feeding one codec.

[[ports]]
name = "quic_in"
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "frames_in"
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "mqtt_out"
direction = "output"
content_type = "OctetStream"

[[ports]]
name = "quic_out"
direction = "output"
content_type = "OctetStream"

[observability]
metrics = ["bytes_in", "bytes_out", "stream_frames_in", "stream_frames_out", "quic_decode_errors", "frames_dropped"]
