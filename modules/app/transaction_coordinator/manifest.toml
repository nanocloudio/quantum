version = "0.1.0"
type             = "Transformer"
entry            = "mod.rs"
hardware_targets = ["bcm2712"]

[[ports]]
name = "op_in"
direction = "input"
content_type = "OctetStream"
[[ports]]
name = "durability_in"
direction = "input"
content_type = "OctetStream"
[[ports]]
name = "result_out"
direction = "output"
content_type = "OctetStream"
[[ports]]
name = "metrics"
direction = "output"
content_type = "OctetStream"

[observability]
metrics = ["bytes_in", "bytes_out", "txn_begins", "txn_commits", "txn_aborts"]
