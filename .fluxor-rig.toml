# Build recipes for quantum scenarios under `tests/hardware/`.
# Consulted by `fluxor rig test` after walking up from the scenario
# file. `${scenario.config}` resolves at plan-time to the absolute
# path of the scenario's `config = "…"` field and is passed to bash
# as `$1`.

# Pi 5 / pi5-a: kernel image = fluxor firmware + foundation fmods +
# clustor substrate fmods + quantum modules + config blob. Steps:
#
#   1. Build fluxor's pi5 firmware from the sibling checkout.
#      (Firmware is per-deployment, not a registry artefact —
#      built fresh each scenario.)
#   2. `fluxor sync` materialises the fluxor SDK source (used by
#      quantum's PIC modules via `#[path]`) plus foundation +
#      substrate fmods into `target/fluxor/`. Must precede the
#      module build — quantum's `mod.rs` files include
#      `target/fluxor/fluxor-abi/sdk/abi.rs` directly.
#   3. Build quantum's PIC modules into `target/fluxor/bcm2712/modules/`.
#   4. Stage `target/pi5/firmware.bin` where `fluxor build` expects it.
#   5. `fluxor build` consolidates firmware + modules + config into
#      a single kernel image at `target/pi5/images/<stem>.img`.
#
# Assumes the sibling-checkout layout (../fluxor and ../clustor
# resolvable from quantum's root) the workspace-mode dev rig uses.
# The final cp stages the just-built image (named after the config stem
# by `fluxor build`) onto the fixed `artifact` path below — the artifact
# field does not interpolate ${scenario.*}, so without the copy any
# scenario whose config stem differs from consensus-bench-pi5 would
# stage a stale image (or fail on a missing one).
[build.pi5]
command = [
    "bash",
    "-c",
    "set -e && make -C ../fluxor firmware TARGET=pi5 && fluxor sync && fluxor modules build --target bcm2712 --out target && mkdir -p target/pi5 && cp ../fluxor/target/pi5/firmware.bin target/pi5/firmware.bin && fluxor build \"$1\" && img=\"target/pi5/images/$(basename \"$1\" .yaml).img\" && { [ \"$img\" -ef target/pi5/images/consensus-bench-pi5.img ] || cp \"$img\" target/pi5/images/consensus-bench-pi5.img; }",
    "_",
    "${scenario.config}",
]
artifact = "target/pi5/images/consensus-bench-pi5.img"
