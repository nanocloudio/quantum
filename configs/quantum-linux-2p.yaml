# Quantum: 2-partition variant of quantum-linux-minimal.yaml.
#
# Demonstrates per-partition state isolation under the multi-Raft
# substrate (clustor/docs/rfc_partition_groups.md): each partition gets
# its own Raft pipeline instances, wired as:
#
#   partition_router (num_partitions=2)
#     ├─ proposals_out_p<i> → consensus_p<i> ⇄ durability_p<i>
#     │                                      → session_processor
#
# QoS 1 PUBLISH flows on the tagged direct path
# (`session_processor.proposals_tagged → partition_router.proposals_tagged
# → consensus_p<i>.proposals_partitioned_tagged`); the untagged path
# carries CONNECT/DISCONNECT.
#
# Single-node config has no peers, so neither consensus instance emits net
# traffic. What this validates is module instantiation under per-partition
# naming, correct per-partition durability pairing, and that the port
# budget stays under cap.
#
# After running the regression and producing a few CONNECTs, both the
# flat `wal/seg_*` path (partition 0, default location) and
# `wal/p0001/seg_*` should accumulate — the per-partition WAL paths
# evidence state isolation.

target: linux
tick_us: 1000

# The graph is cyclic by construction: the session/messaging round trips
# and the per-partition Raft commit loops are feedback edges, not
# reentrant paths. prepare_graph rejects the graph outright without this.
scheduler:
  accept_cycles: true

# Substrate manifests live in clustor/modules/ (single source of truth);
# quantum/modules/ holds only quantum-specific modules. See
# `clustor/docs/substrate_sharing.md`.
module_search_paths:
  - ../../clustor/modules/app

platform:
  net: {}

modules:
  # ── Clustor substrate ──────────────────────────────────────
  - name: peer_router
  - name: partition_router
    params:
      num_partitions: 2

  # Partition 0 — its own consensus + durability instance. Both carry
  # `partition_id: 0`, so each filters the fanned-out peer_router
  # streams down to its own partition and writes its own WAL path.
  - name: consensus_p0
    type: consensus
    params:
      partition_id: 0
  - name: durability_p0
    type: durability
    params:
      partition_id: 0

  # Partition 1 — the mirror pipeline, fully isolated from partition 0.
  - name: consensus_p1
    type: consensus
    params:
      partition_id: 1
  - name: durability_p1
    type: durability
    params:
      partition_id: 1

  # Shared substrate (one instance regardless of partition count).
  - name: control_plane
  - name: admission
  - name: gateway
  - name: operations

  # ── Quantum MQTT stack ─────────────────────────────────────
  - name: protocol
    variant: mqtt
  - name: session_processor
    variant: mqtt
  - name: flow
  - name: topic_engine
  - name: messaging

wiring:
  # ── Transport: linux_net ↔ peer_router ─────────────────────
  - from: linux_net.net_out
    to: peer_router.net_in
  - from: peer_router.net_out
    to: linux_net.net_in

  # ── peer_router → protocol ──────────────────────────
  - from: peer_router.cleartext
    to: protocol.raw_in
  # peer_router parses the 5-byte partitioned wire envelope and emits
  # MSG_APPEND_ENTRIES_RESP frames on `peer_rx` and other Raft RPCs
  # (votes, AE, heartbeats, snapshot chunks) on `raft_rpc`. Both ports
  # are fanned out to every per-partition consumer; each instance
  # filters by its own `partition_id` so cross-partition frames are
  # dropped.
  - from: peer_router.peer_rx
    to: consensus_p0.ack
  - from: peer_router.peer_rx
    to: consensus_p1.ack
  - from: peer_router.raft_rpc
    to: consensus_p0.rpc
  - from: peer_router.raft_rpc
    to: consensus_p1.rpc

  # ── Codecs / gateway ─────────────────────────────────────────
  - from: protocol.http_out
    to: gateway.requests
  - from: gateway.responses
    to: peer_router.client_resp
  - from: protocol.frames_out
    to: peer_router.client_resp
  - from: protocol.proposals_out
    to: session_processor.codec_in
  - from: session_processor.codec_out
    to: protocol.responses_in

  # ── session_processor → partition_router → per-partition Raft ──
  # Untagged path (CONNECT/DISCONNECT) — body hashed → partition.
  - from: session_processor.proposals
    to: partition_router.proposals
  - from: partition_router.proposals_p0
    to: consensus_p0.proposals_partitioned
  - from: partition_router.proposals_p1
    to: consensus_p1.proposals_partitioned

  # Tagged path (QoS 1 PUBLISH) — body hashed → partition; correlation
  # id round-trips back via raft.proposal_assigned → session_processor
  # → `flow`.
  - from: session_processor.proposals_tagged
    to: partition_router.proposals_tagged
  - from: partition_router.proposals_tagged_p0
    to: consensus_p0.proposals_partitioned_tagged
  - from: partition_router.proposals_tagged_p1
    to: consensus_p1.proposals_partitioned_tagged

  # Both partitions emit MSG_PROPOSAL_ASSIGNED with their own
  # partition_id stamped in; session_processor.assigned_in fans them
  # in and forwards (partition_id, wal_index) to `flow` so cross-
  # partition durability proofs don't alias.
  - from: consensus_p0.proposal_assigned
    to: session_processor.assigned_in
  - from: consensus_p1.proposal_assigned
    to: session_processor.assigned_in
  # ── Partition 0: full Raft + commit pipeline ───────────────
  - from: consensus_p0.net_out
    to: peer_router.repl_tx
  - from: consensus_p0.rpc_out
    to: peer_router.peer_tx
  - from: consensus_p0.log_append
    to: durability_p0.entries
  # A restarted replica reads its replayed log bodies back out of the
  # local WAL: replay restores the log, so log-matching succeeds and the
  # leader never re-ships those entries. Without this pair the apply path
  # stalls at the first gap.
  - from: consensus_p0.entry_request
    to: durability_p0.entry_request
    buffer_bytes: 8192
  - from: durability_p0.entry_reply
    to: consensus_p0.entry_reply
    buffer_bytes: 8192
  - from: durability_p0.quorum_durable
    to: consensus_p0.durable
  - from: consensus_p0.applied
    to: session_processor.committed_in
  - from: consensus_p0.committed_entries
    to: session_processor.committed_in
  # ── Partition 1: full Raft + commit pipeline ───────────────
  - from: consensus_p1.net_out
    to: peer_router.repl_tx
  - from: consensus_p1.log_append
    to: durability_p1.entries
  # A restarted replica reads its replayed log bodies back out of the
  # local WAL: replay restores the log, so log-matching succeeds and the
  # leader never re-ships those entries. Without this pair the apply path
  # stalls at the first gap.
  - from: consensus_p1.entry_request
    to: durability_p1.entry_request
    buffer_bytes: 8192
  - from: durability_p1.entry_reply
    to: consensus_p1.entry_reply
    buffer_bytes: 8192
  - from: durability_p1.quorum_durable
    to: consensus_p1.durable
  - from: consensus_p1.applied
    to: session_processor.committed_in
  - from: consensus_p1.committed_entries
    to: session_processor.committed_in

  # ── ACK tracker (cross-partition fan-in) ───────────────────
  # Every partition's durability instance streams MSG_DURABILITY_PROOF
  # (19 bytes, partition_id-stamped) into `flow`; its ack component
  # keys inflight by `(partition_id, wal_index)` so a proof for p1
  # never satisfies an inflight registered against p0.
  - from: durability_p0.quorum_durable
    to: flow.durability_in
  - from: durability_p1.quorum_durable
    to: flow.durability_in
  - from: session_processor.forward_out
    to: flow.forward_in
  - from: flow.ack_out
    to: session_processor.ack_in

  # ── Admission credits (direct) + flow inputs ───────────────
  - from: admission.credits
    to: gateway.credit_supply
  - from: admission.credits
    to: session_processor.flow_in
  - from: admission.envelope
    to: flow.envelope_in
  - from: consensus_p0.lag_signal
    to: admission.lag
  - from: consensus_p1.lag_signal
    to: admission.lag
  - from: gateway.rejected
    to: flow.rejected_in
  - from: flow.flow_out
    to: session_processor.flow_in

  # ── Topic engine ───────────────────────────────────────────
  - from: session_processor.topic_out
    to: topic_engine.op_in
  - from: topic_engine.deliver_out
    to: session_processor.deliver_in

  # ── Messaging infrastructure ───────────────────────────────
  # ── Messaging composite (dedup / offline / retained) ────
  # One op bus in, one reply bus out: the composite's dispatch
  # table demuxes by msg_type and the session state machine
  # demuxes the replies, exactly as across the separate edges.
  - from: session_processor.messaging_out
    to: messaging.op_in
  - from: messaging.result_out
    to: session_processor.messaging_in

  # ── Control plane ──────────────────────────────────────────
  # CP proofs are cluster-wide; fan out to every per-partition
  # consensus instance.
  - from: control_plane.proof
    to: admission.proof
  - from: admission.cache_state
    to: consensus_p0.cp_state
  - from: admission.cache_state
    to: consensus_p1.cp_state
  - from: admission.strict_fallback
    to: consensus_p0.cp_state
  - from: admission.strict_fallback
    to: consensus_p1.cp_state

  # ── HTTP admin / Raft surface ──────────────────────────────
  - from: gateway.raft_rpc
    to: consensus_p0.rpc

  # ── Metrics fan-in ─────────────────────────────────────────
  - from: consensus_p0.metrics
    to: operations.ingest
  - from: consensus_p1.metrics
    to: operations.ingest
  - from: durability_p0.metrics
    to: operations.ingest
  - from: durability_p1.metrics
    to: operations.ingest
  - from: admission.metrics
    to: operations.ingest
  - from: session_processor.metrics_out
    to: operations.ingest
  - from: operations.readyz
    to: gateway.readyz_data
  - from: operations.export
    to: gateway.metrics_data
