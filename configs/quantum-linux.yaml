# Quantum: Single-node Linux test (no TLS)
#
# Full 14-module pipeline: 7 Clustor substrate modules + 7 Quantum
# application modules. Composes a multi-protocol broker (MQTT/Kafka/AMQP)
# on top of the Raft consensus substrate.
#
# Channel budget: 75 declared edges expand to 92 channels once
# prepare_graph inserts a tee per fanned output port and a merge per
# fanned input port (each costs one channel and one internal module),
# against the kernel's MAX_GRAPH_EDGES=128. Adding a fanned edge here
# costs two channels, not one — check the budget before wiring.
#
# Clients connect on port 9090 (linux_net TCP). Protocol selected by ALPN
# tag (or first-byte sniffing for non-TLS). Management surface on 9100.

target: linux
tick_us: 1000

# The graph is cyclic by construction: the session/messaging round trips
# (session_processor → messaging → session_processor, → topic_engine →,
# → flow →) and the Raft commit loop are feedback edges, not
# reentrant paths. prepare_graph rejects the graph outright without this.
scheduler:
  accept_cycles: true

# Substrate (consensus, durability, peer_router, partition_router, etc.) lives in
# clustor/modules/ — quantum/modules/ is reserved for quantum-specific
# modules (protocol, session_processor, …). The fluxor tool searches
# these paths in order when resolving manifests; see
# `clustor/docs/substrate_sharing.md`.
module_search_paths:
  - ../../clustor/modules/app

platform:
  net: {}

modules:
  # ── Clustor substrate (7 modules, stock) ─────────────────
  - name: peer_router
  - name: gateway
  - name: consensus
    params:
      # See quantum-linux-minimal.yaml: 1 ms proposal batching removes the
      # ~100 batch/s pacing floor the 10 ms default put under every ack.
      proposal_batch_timeout_ms: 1
  - name: durability
    params:
      # Write-path profile ported from lattice's rig-tuned
      # bare-metal-pi5.yaml (measured there: write p50/p99 12.0/14.2 →
      # 5.1/7.1 ms, durable ceiling ~1050 → ~3900/s):
      #   fsync_mode 1     — group fsync; equal latency, higher ceiling.
      #   group_window_ms 0 — the wall-clock batch window sat directly in
      #                       every write ack; flush every poll, batching
      #                       still engages under burst via max_pending.
      #   fence_depth 8    — pipeline async fsync fences; >8 gains nothing
      #                       (device completes barriers serially).
      #   segment_bytes 4M — segment rotation runs a synchronous snapshot
      #                       persist; small segments fire it often enough
      #                       to blow p99.
      fsync_mode: 1
      group_window_ms: 0
      group_max_pending: 8
      fence_depth: 8
      segment_bytes: 4194304
  - name: control_plane
  - name: admission
  - name: operations

  # ── Quantum: protocol routing & codecs (1 module) ──────
  - name: protocol

  # ── Quantum: session core (1 module) ────────────────────
  - name: session_processor

  # ── Quantum: flow/ack (1 module) ───────────────────────
  - name: flow

  # ── Quantum: topic & messaging (2 modules) ──────────────
  - name: topic_engine
  - name: messaging

  # ── Quantum: forwarding (1 module) ──────────────────────
  - name: forward_coordinator

  # ── Quantum: control plane + ops (1 module) ────────────
  - name: governance

wiring:
  # ── Transport: linux_net ↔ peer_router ──────────────────
  - from: linux_net.net_out
    to: peer_router.net_in
  - from: peer_router.net_out
    to: linux_net.net_in

  # ── peer_router fan-out ─────────────────────────────────
  # Client cleartext fans to gateway (admin/raft HTTP) and to
  # protocol (ALPN demux for the app protocols); peer traffic
  # goes to consensus.
  - from: peer_router.cleartext
    to: gateway.requests
  - from: peer_router.cleartext
    to: protocol.raw_in
  - from: peer_router.peer_rx
    to: consensus.ack

  # ── Protocol router → codecs ────────────────────────────

  # ── Codec response frames → peer_router
  - from: protocol.frames_out
    to: peer_router.client_resp

  # ── Codecs → session_processor ──────────────────────────
  - from: protocol.proposals_out
    to: session_processor.codec_in

  # ── session_processor response path ─────────────────────
  - from: session_processor.codec_out
    to: protocol.responses_in

  # ── session_processor → Raft proposals ──────────────────
  - from: session_processor.proposals
    to: consensus.proposals

  # Tagged path for QoS 1+ PUBLISH — consensus echoes
  # MSG_PROPOSAL_ASSIGNED so session_processor can bind correlation_id
  # → wal_index and register the inflight with `flow`.
  - from: session_processor.proposals_tagged
    to: consensus.proposals_tagged
  - from: consensus.proposal_assigned
    to: session_processor.assigned_in

  # ── HTTP surface (admin + raft RPC via stock path) ──────
  - from: gateway.raft_rpc
    to: consensus.rpc
  - from: gateway.admin_req
    to: operations.admin_req
  - from: gateway.responses
    to: peer_router.client_resp
  # ── Client pipeline (HTTP admin clients) ─────────────────
  - from: gateway.proposals_tagged
    to: consensus.proposals_tagged
  - from: gateway.rejected
    to: flow.rejected_in

  # ── Flow control ────────────────────────────────────────
  - from: admission.credits
    to: gateway.credit_supply
  - from: admission.credits
    to: session_processor.flow_in
  - from: consensus.lag_signal
    to: admission.lag

  - from: flow.flow_out
    to: session_processor.flow_in

  - from: session_processor.forward_out
    to: flow.forward_in

  # ── Flow composite: ack / backpressure / prefetch ────────
  - from: durability.quorum_durable
    to: flow.durability_in
  - from: flow.ack_out
    to: session_processor.ack_in

  # ── Topic engine (single op_in port, demuxed by msg_type) ──
  - from: session_processor.topic_out
    to: topic_engine.op_in
  - from: topic_engine.deliver_out
    to: session_processor.deliver_in
  - from: topic_engine.forward_out
    to: forward_coordinator.forward_in

  # ── Messaging composite (dedup / offline / retained) ────
  # One op bus in, one reply bus out: the composite's dispatch
  # table demuxes by msg_type and the session state machine
  # demuxes the replies, exactly as across the separate edges.
  - from: session_processor.messaging_out
    to: messaging.op_in
  - from: messaging.result_out
    to: session_processor.messaging_in
  - from: messaging.metrics
    to: governance.ingest

  # Kafka consumer groups (JoinGroup/SyncGroup/Heartbeat/OffsetCommit,
  # API keys 8-16) are served inside session_processor against its own
  # group + offset tables; they need no graph edge.

  # ── Cross-PRG forwarding ────────────────────────────────
  - from: forward_coordinator.local_out
    to: consensus.proposals
  - from: forward_coordinator.remote_out
    to: peer_router.peer_tx
  # ── Raft replication ────────────────────────────────────
  - from: consensus.net_out
    to: peer_router.peer_tx
  - from: consensus.rpc_out
    to: peer_router.peer_tx

  # ── Persistence ─────────────────────────────────────────
  - from: consensus.log_append
    to: durability.entries
    # Rate-class the durability edge so the WAL's entry-pump gets a real
    # per-step byte grant instead of 0. Unclassed (grant=0) forces the pump
    # to `process_entries` exactly ONCE per step (`if grant == 0 { break; }`),
    # capping durable-write throughput at 1 entry/tick regardless of backlog,
    # fence depth, or cores. With a transaction grant the pump batches up to
    # MAX_ENTRY_PUMP_RECORDS entries/step → one fsync amortises the whole
    # batch. (Same fix as lattice's bare-metal-pi5.yaml.)
    rate: transaction
  # A restarted replica reads its replayed log bodies back out of the
  # local WAL: replay restores the log, so log-matching succeeds and the
  # leader never re-ships those entries. Without this pair the apply path
  # stalls at the first gap.
  - from: consensus.entry_request
    to: durability.entry_request
    buffer_bytes: 8192
  - from: durability.entry_reply
    to: consensus.entry_reply
    buffer_bytes: 8192
  # Leader self-durability: raft learns its own WAL flush progress
  # directly; without it the leader's durable advance rides the ~150 ms
  # heartbeat round (measured: flat ~200 ms floor under every durable
  # produce ack). Mirrors consensus-bench-pi5.yaml.
  - from: durability.flushed
    to: consensus.wal_flushed
  # Boot handoff: raft resumes at the WAL replay high-water before
  # intake opens; a warm restart without it wedges the WAL within
  # ~MAX_UNCOMMITTED_INFLIGHT entries.
  - from: durability.replay_complete
    to: consensus.wal_replay_complete
    rate: transaction
  # Cross-node durability acks fan back into the ledger (multi-node
  # quorum; harmless single-node).
  - from: consensus.cross_durability_ack
    to: durability.ack
  - from: durability.quorum_durable
    to: consensus.durable
  # ── Commit → apply → session_processor ──────────────────
  - from: consensus.applied
    to: session_processor.committed_in
  - from: consensus.committed_entries
    to: session_processor.committed_in
  - from: consensus.applied
    to: gateway.applied

  # ── Snapshots ───────────────────────────────────────────
  - from: durability.export_chunks
    to: consensus.snapshot_rx
  - from: consensus.snapshot_import
    to: durability.import_chunks
  - from: durability.manifest_auth
    to: peer_router.peer_tx
  - from: durability.compaction_signal
    to: governance.wal_signal_in
  - from: durability.export_chunks
    to: governance.snapshot_resp_in

  # ── Control plane ───────────────────────────────────────
  - from: control_plane.proof
    to: admission.proof
  - from: admission.cache_state
    to: consensus.cp_state
  - from: admission.strict_fallback
    to: consensus.cp_state
  - from: admission.permits
    to: consensus.read_permits
  - from: control_plane.routing
    to: gateway.placement

  # ── Tenant enforcement ──────────────────────────────────
  # control_plane emits one record per refresh tick — currently the
  # synthetic default `[tenant_id=0][max_rate=10000]` (clustor's cp.rs
  # marks it a placeholder). Wiring it makes quota enforcement
  # CP-driven rather than bootstrap-only; it does NOT establish a
  # CONNECT→tenant mapping, which needs real CP tenant data. See
  # docs/architecture/multi_tenancy.md "Implementation status".
  - from: control_plane.tenant_records
    to: governance.records_in
  - from: governance.quota_signals
    to: gateway.credit_supply
  - from: governance.disconnect_events
    to: session_processor.cp_in
  # ── Admin ───────────────────────────────────────────────
  - from: operations.denied
    to: gateway.admin_responses
  - from: operations.raft_commands
    to: consensus.admin_proposals
  - from: operations.responses
    to: gateway.admin_responses
  - from: governance.promotion
    to: operations.admin_requests

  # ── Audit fan-in ────────────────────────────────────────
  - from: operations.audit_events
    to: governance.audit_in
  - from: session_processor.audit_out
    to: governance.audit_in
  - from: governance.signed_events
    to: gateway.admin_responses

  # ── Metrics aggregator (Quantum dimensional) ────────────
  - from: session_processor.metrics_out
    to: governance.ingest
  - from: forward_coordinator.metrics
    to: governance.ingest
  - from: flow.metrics
    to: governance.ingest
  - from: topic_engine.metrics
    to: governance.ingest
  - from: governance.rollups
    to: operations.ingest

  # ── Substrate metrics fan-in (stock Clustor path) ───────
  - from: consensus.metrics
    to: operations.ingest
  - from: durability.metrics
    to: operations.ingest
  - from: admission.metrics
    to: operations.ingest

  # ── Telemetry → HTTP ────────────────────────────────────
  - from: operations.readyz
    to: gateway.readyz_data
  - from: operations.why
    to: gateway.why_data
  - from: operations.export
    to: gateway.metrics_data
