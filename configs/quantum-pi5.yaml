# Quantum: Pi 5 multi-domain production graph (15 modules, 6 logical domains).
#
# Channel budget: 79 declared edges + 3 injected by the pi5 `net` stack
# expand to 100 channels once prepare_graph inserts a tee per fanned
# output port and a merge per fanned input port (each costs one channel
# and one internal module), against the kernel's MAX_GRAPH_EDGES=128.
#
# Maps the doc's 6-domain layout onto a 4-core Pi 5: ingest co-locates with
# apply on Core 3, messaging co-locates with ops on Core 0.
#
# Domain placement:
#   Core 0 (Tier 0, 1ms): ops      — control_plane, operations,
#                                     governance (tenants / dr / audit / telemetry)
#   Core 0 (Tier 1, 250µs, shared): messaging — the dedup / offline /
#                                     retained composite
#   Core 1 (Tier 3, poll-mode): consensus — consensus, durability
#   Core 2 (Tier 3, poll-mode): network — tls, peer_router
#   Core 3 (Tier 1, 250µs): apply  — gateway, admission, session_processor,
#                                     flow, forward_coordinator
#   Core 3 (Tier 2, 500µs, shared): ingest — protocol, topic_engine
#
# 4 declared execution domains (kernel currently models 4); the 6-domain
# logical view maps as: ingest co-runs on apply core, messaging on ops core.
# A pi5-class part with 6 cores can split these into dedicated domains.

target: pi5
tick_us: 1000

# The graph is cyclic by construction: the session/messaging round trips
# and the Raft commit loop are feedback edges, not reentrant paths.
# prepare_graph rejects the graph outright (rc=-22) without this.
scheduler:
  accept_cycles: true

# Substrate (consensus, durability, peer_router, partition_router, etc.) lives in
# clustor/modules/ — quantum/modules/ is reserved for quantum-specific
# modules (protocol, session_processor, …). The fluxor tool searches
# these paths in order when resolving manifests; see
# `clustor/docs/substrate_sharing.md`.
module_search_paths:
  - ../../clustor/modules/app

platform:
  net: {}

execution:
  domains:
    - name: ops
      exec_mode: cooperative
    - name: consensus
      exec_mode: poll
    - name: network
      exec_mode: poll
    - name: apply
      tick_us: 250
      exec_mode: high_rate

modules:
  # ── Network (Core 2: poll-mode) ─────────────────────────
  - name: tls
    domain: network
    mode: 1
    verify_peer: 1
  - name: peer_router
    domain: network
  # ── Consensus + persistence (Core 1: poll-mode) ─────────
  - name: consensus
    domain: consensus
    params:
      # See quantum-linux-minimal.yaml: 1 ms proposal batching removes the
      # ~100 batch/s pacing floor the 10 ms default put under every ack.
      proposal_batch_timeout_ms: 1
  - name: durability
    domain: consensus
    params:
      # Write-path profile ported from lattice's rig-tuned bare-metal-pi5
      # config (see quantum-linux.yaml durability block for the measured wins).
      # root_path=1 is load-bearing on bare-metal FAT32: no mkdir → no
      # `wal/` parent, and without it FS_OPEN_CREATE fails and the WAL
      # silently degrades to in-memory (ws=0, commit_index=0).
      fsync_mode: 1
      group_window_ms: 0
      group_max_pending: 8
      fence_depth: 8
      segment_bytes: 4194304
      root_path: 1

  # ── Apply + ingest (Core 3: 250µs / 500µs) ──────────────
  - name: gateway
    domain: apply
  - name: admission
    domain: apply
  - name: session_processor
    domain: apply
  - name: flow
    domain: apply
  - name: forward_coordinator
    domain: apply
  - name: protocol
    domain: apply
  - name: topic_engine
    domain: apply

  # ── Ops + messaging (Core 0: 1ms / 250µs) ───────────────
  - name: control_plane
    domain: ops
  - name: operations
    domain: ops
  - name: messaging
    domain: ops
  - name: governance
    domain: ops

wiring:
  # ── Network transport: ip ↔ tls ↔ peer_router ───────────
  # The ciphertext side faces the NIC stack, the cleartext side faces
  # the broker. Without the ciphertext pair the graph has no path to
  # the NIC at all — tls terminates nothing and peer_router never sees
  # a byte.
  - from: ip.net_out
    to: tls.cipher_in
  - from: tls.cipher_out
    to: ip.net_in
  - from: tls.clear_out
    to: peer_router.net_in
  - from: peer_router.net_out
    to: tls.clear_in

  # ── peer_router fan-out ─────────────────────────────────
  - from: peer_router.cleartext
    to: protocol.raw_in
    edge_class: cross_core
  - from: peer_router.cleartext
    to: gateway.requests
    edge_class: cross_core
  - from: peer_router.peer_rx
    to: consensus.ack

  # ── Protocol routing ────────────────────────────────────
  - from: protocol.frames_out
    to: peer_router.client_resp

  # ── Codecs ↔ session_processor (intra-domain) ───────────
  - from: protocol.proposals_out
    to: session_processor.codec_in
  - from: session_processor.codec_out
    to: protocol.responses_in

  # ── session_processor → Raft (cross-core: apply→consensus)
  - from: session_processor.proposals
    to: consensus.proposals
    edge_class: cross_core

  # Tagged path for QoS 1+ PUBLISH — consensus echoes
  # MSG_PROPOSAL_ASSIGNED so session_processor can bind correlation_id
  # → wal_index and register the inflight with `flow`.
  - from: session_processor.proposals_tagged
    to: consensus.proposals_tagged
    edge_class: cross_core
  - from: consensus.proposal_assigned
    to: session_processor.assigned_in
    edge_class: cross_core

  # ── HTTP/admin path ─────────────────────────────────────
  - from: gateway.raft_rpc
    to: consensus.rpc
    edge_class: cross_core
  - from: gateway.admin_req
    to: operations.admin_req
  - from: gateway.responses
    to: peer_router.client_resp
    edge_class: cross_core
  - from: gateway.proposals_tagged
    to: consensus.proposals_tagged
    edge_class: cross_core
  - from: gateway.rejected
    to: flow.rejected_in

  # ── Flow control ────────────────────────────────────────
  - from: admission.credits
    to: gateway.credit_supply
  - from: admission.credits
    to: session_processor.flow_in
  - from: consensus.lag_signal
    to: admission.lag
    edge_class: cross_core
  - from: flow.flow_out
    to: session_processor.flow_in
  - from: session_processor.forward_out
    to: flow.forward_in

  # ── ACK tracking ────────────────────────────────────────
  - from: durability.quorum_durable
    to: flow.durability_in
    edge_class: cross_core
  - from: flow.ack_out
    to: session_processor.ack_in

  # ── Topic engine + forwarding (single op_in port, demuxed by msg_type) ──
  - from: session_processor.topic_out
    to: topic_engine.op_in
  - from: topic_engine.deliver_out
    to: session_processor.deliver_in
  - from: topic_engine.forward_out
    to: forward_coordinator.forward_in
  - from: forward_coordinator.local_out
    to: consensus.proposals
    edge_class: cross_core
  - from: forward_coordinator.remote_out
    to: peer_router.peer_tx
  - from: forward_coordinator.wal_marker
    to: consensus.proposals
    edge_class: cross_core

  # ── Messaging infra (cross-core: apply ↔ ops) ───────────
  # ── Messaging composite (dedup / offline / retained) ────
  # One op bus in, one reply bus out: the composite's dispatch
  # table demuxes by msg_type and the session state machine
  # demuxes the replies, exactly as across the separate edges.
  - from: session_processor.messaging_out
    to: messaging.op_in
  - from: messaging.result_out
    to: session_processor.messaging_in
  - from: messaging.metrics
    to: governance.ingest
  # ── Raft replication (consensus ↔ network) ──────────────
  - from: consensus.net_out
    to: peer_router.peer_tx
  - from: consensus.rpc_out
    to: peer_router.peer_tx
    edge_class: cross_core

  # ── Persistence (consensus, inlined) ────────────────────
  - from: consensus.log_append
    to: durability.entries
    # Rate-class the durability edge: unclassed (grant=0) pins the WAL
    # entry-pump to ONE record per step regardless of backlog — see the
    # matching comment in quantum-linux.yaml.
    rate: transaction
  # A restarted replica reads its replayed log bodies back out of the
  # local WAL: replay restores the log, so log-matching succeeds and the
  # leader never re-ships those entries. Without this pair the apply path
  # stalls at the first gap.
  - from: consensus.entry_request
    to: durability.entry_request
    buffer_bytes: 8192
  - from: durability.entry_reply
    to: consensus.entry_reply
    buffer_bytes: 8192
  # Raft resumes at the WAL replay high-water before intake opens.
  - from: durability.replay_complete
    to: consensus.wal_replay_complete
    rate: transaction
  # NOTE (durability chain, apply when this graph is slimmed under the
  # 128-edge budget): three edges are REQUIRED for a correct fast
  # durability chain but do not fit the raw edge limit here today —
  #   durability.flushed         -> consensus.wal_flushed
  #   durability.replay_complete -> consensus.wal_replay_complete  (rate: transaction)
  #   consensus.cross_durability_ack -> durability.ack
  # See quantum-pi5-kafka-bench.yaml for the wired + measured version
  # (leader self-durability removes a flat ~200 ms ack floor; the replay
  # handshake prevents the warm-restart WAL wedge).
  - from: durability.quorum_durable
    to: consensus.durable
  # ── Commit → apply → session_processor ──────────────────
  - from: consensus.applied
    to: session_processor.committed_in
  - from: consensus.committed_entries
    to: session_processor.committed_in
  - from: consensus.applied
    to: gateway.applied
    edge_class: cross_core

  # ── Snapshot pipeline ───────────────────────────────────
  - from: durability.export_chunks
    to: consensus.snapshot_rx
  - from: consensus.snapshot_import
    to: durability.import_chunks
  - from: durability.manifest_auth
    to: peer_router.peer_tx
  - from: durability.compaction_signal
    to: governance.wal_signal_in
    edge_class: cross_core
  - from: durability.export_chunks
    to: governance.snapshot_resp_in
  - from: governance.snapshot_req
    to: durability.trigger
  # durability's cert refresh has no consumer: the tls foundation module
  # has no cert_update port, so cert rotation happens via TLS module
  # reload in production.

  # ── Control plane ───────────────────────────────────────
  - from: control_plane.proof
    to: admission.proof
  - from: admission.cache_state
    to: consensus.cp_state
    edge_class: cross_core
  - from: admission.strict_fallback
    to: consensus.cp_state
    edge_class: cross_core
  - from: admission.permits
    to: consensus.read_permits
  - from: control_plane.routing
    to: gateway.placement
  - from: control_plane.tenant_records
    to: governance.records_in
  - from: control_plane.capabilities
    to: session_processor.cp_in
    edge_class: cross_core

  # ── Tenant enforcement ──────────────────────────────────
  - from: governance.quota_signals
    to: gateway.credit_supply
    edge_class: cross_core
  - from: governance.disconnect_events
    to: session_processor.cp_in
    edge_class: cross_core
  # ── Admin ───────────────────────────────────────────────
  - from: operations.denied
    to: gateway.admin_responses
  - from: operations.raft_commands
    to: consensus.admin_proposals
    edge_class: cross_core
  - from: operations.responses
    to: gateway.admin_responses
  - from: governance.promotion
    to: operations.admin_requests

  # ── Audit fan-in ────────────────────────────────────────
  - from: operations.audit_events
    to: governance.audit_in
  - from: session_processor.audit_out
    to: governance.audit_in
    edge_class: cross_core
  - from: governance.signed_events
    to: gateway.admin_responses

  # ── Metrics aggregation ─────────────────────────────────
  - from: session_processor.metrics_out
    to: governance.ingest
    edge_class: cross_core
  - from: forward_coordinator.metrics
    to: governance.ingest
    edge_class: cross_core
  - from: flow.metrics
    to: governance.ingest
    edge_class: cross_core
  - from: topic_engine.metrics
    to: governance.ingest
    edge_class: cross_core
  - from: governance.rollups
    to: operations.ingest

  # ── Substrate metrics ───────────────────────────────────
  - from: consensus.metrics
    to: operations.ingest
    edge_class: cross_core
  - from: durability.metrics
    to: operations.ingest
    edge_class: cross_core
  - from: admission.metrics
    to: operations.ingest
    edge_class: cross_core
  - from: operations.readyz
    to: gateway.readyz_data
  - from: operations.why
    to: gateway.why_data
  - from: operations.export
    to: gateway.metrics_data
