# Quantum bare-metal smoke — minimum viable pi5 graph.
#
# Empty (`modules: []`) graph that exercises the dev-host → DUT
# pipeline through to kernel handoff: bootloader → TFTP fetch →
# kernel load → scheduler tick → platform-runtime debug drain.
# Paired with `tests/hardware/quantum_pi5_boot.toml`, whose pass
# signal (`observe.netboot_fetch` matching `kernel_2712.img`) fires
# at the TFTP-fetch stage — the deepest signal the rig observes
# under the current RP1 UART gating
# (see `~/.config/fluxor/labs/default/rigs/pi5-a.md` "UART cable").
#
# The full quantum graph lives in `quantum-pi5.yaml`; it carries
# additional rig prerequisites (NVMe-backed FAT32 for persistent
# WAL, full consumer pipeline) that this smoke does not.
target: pi5
tick_us: 1000
modules: []
wiring: []
