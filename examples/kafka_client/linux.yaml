# Quantum's Kafka client (consumer-group membership) — standalone, no chronicle.
#   docker run -d --rm --name qtm-kafka -p 19092:9092 \
#     -e KAFKA_NODE_ID=1 -e KAFKA_PROCESS_ROLES=broker,controller \
#     -e KAFKA_LISTENERS='PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093' \
#     -e KAFKA_ADVERTISED_LISTENERS='PLAINTEXT://127.0.0.1:19092' \
#     -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
#     -e KAFKA_CONTROLLER_QUORUM_VOTERS='1@localhost:9093' \
#     -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP='CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT' \
#     -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
#     -e KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0 apache/kafka:3.7.0
#   fluxor run examples/kafka_client/linux.yaml   # -> "kafka: group member stable"
# NOTE: give each concurrent run its own group_id, or they rebalance each other.
target: linux
tick_us: 100
scheduler:
  accept_cycles: true
platform:
  cli: {}
  net: {}
modules:
  - name: kafka_client
    params:
      endpoint: "7f000001944a"   # 127.0.0.1:19092
      group_id: "quantum-demo"
      client_id: "quantum-1"
wiring:
  - from: kafka_client.net_out
    to: linux_net.net_in
  - from: linux_net.net_out
    to: kafka_client.net_in
  - from: kafka_client.status_out
    to: cli_out.bytes_in
