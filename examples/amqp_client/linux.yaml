# Quantum's AMQP 0-9-1 client (connection + channel handshake) — standalone.
#   docker run -d --rm --name qtm-rabbit -p 15672:5672 rabbitmq:3-alpine
#   fluxor run examples/amqp_client/linux.yaml
#   # -> "amqp: connection + channel 1 open"
target: linux
tick_us: 100
scheduler:
  accept_cycles: true
platform:
  cli: {}
  net: {}
modules:
  - name: amqp_client
    params:
      endpoint: "7f000001383d"   # 127.0.0.1:15672 -> container 5672
      user: "guest"
      pass: "guest"
      vhost: "/"
wiring:
  - from: amqp_client.net_out
    to: linux_net.net_in
  - from: linux_net.net_out
    to: amqp_client.net_in
  - from: amqp_client.status_out
    to: cli_out.bytes_in
