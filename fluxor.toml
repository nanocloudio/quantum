# Quantum project configuration consumed by the `fluxor` CLI.

# Project identity. Required for
# `fluxor publish`; downstream projects reference quantum by this
# name.
[project]
name    = "quantum"
version = "0.0.1"

# Cross-project dependencies.
# fluxor provides foundation modules (`ip`, `tls`, `linux_net`, …),
# the ABI source crate (`fluxor-abi`), and the `fluxor-linux` runtime.
# clustor provides the substrate modules (`peer_router`, `consensus`,
# `durability`, `gateway`, …) consumed by quantum's deployment
# graphs. Both resolve from the local OCI store (`$FLUXOR_STORE`,
# default `~/.local/share/fluxor/store`), digest-pinned in
# fluxor.lock; PIC modules in `modules/app/*/mod.rs` consume
# the materialised SDK source at
# `target/fluxor/fluxor-abi/sdk/<file>.rs` (populated by `fluxor sync`).
# Live workspace mode (`~/.fluxor/workspace.toml`) resolves listed
# members to their most recently published artefacts (`:latest`),
# written through fluxor.lock.
[dependencies]
fluxor  = "0.0.1"
clustor = "0.0.1"
# wave provides the HTTP mechanics for the optional diagnostic/admin
# surface: graphs that want it wire wave's `http` (`app` variant) in
# front of clustor's `operations`; graphs that don't carry no wave
# modules at all.
wave    = "0.0.1"

[ci]
# Module targets `fluxor modules build --all` will produce artefacts for.
# Silicon tokens only — the board (pi5) and packaging distinctions live at
# the rig/board level (`.fluxor-rig.toml`), not in the module matrix.
targets = ["bcm2712"]

[ci.lints]
# No exemptions: with no root workspace there is no `[lints] workspace =
# true` opt-in to audit. Each host crate under tools/ inlines the
# shared lint baseline directly, and `tools/ci/host_crates.sh`
# is what enforces it.

[ci.hygiene]
# `modules/**` always bans inline tests (no_std PIC target, can't run them).
# `src/**` does not exist in quantum — the whole source surface is
# modules/ and tools/. Tools crates follow the strict default.
forbid_inline_tests = ["modules", "tools"]
mode                = "strict"
max_inline_lines    = 80

# Per-file exemptions live as [[ci.hygiene.exemption]] tables. None today.

# Crate-root `#![allow(dead_code, unused_imports)]` on the PIC modules.
#
# The cause is not in these files: the build `include!`s and `#[path]`-mounts
# the fluxor SDK wholesale, so every module's compile sees the entire ABI
# surface — provider, telemetry, device_access, net, storage, fmp — and a
# given module calls a handful of it. The unused items are in
# `target/fluxor/fluxor-abi/sdk/**`, which this project does not own and has
# no item to attach an attribute to.
[[ci.hygiene.allow_crate_root]]
prefix = "modules/app/"
reason = """PIC modules mount the fluxor SDK wholesale via include!/#[path], so each compile sees the entire ABI surface and uses a subset; the unused items live in target/fluxor/fluxor-abi/sdk/**, not here."""

# The same shape one layer in: `wire.rs`, `types.rs` and `authority.rs` are
# single definitions `#[path]`-mounted into every consumer, and each consumer
# uses a different subset of the constants and codecs. An `#[expect]` per item
# cannot work — an item unused by one module is used by the next, and
# `#[expect]` is an error wherever the lint does not fire.
[[ci.hygiene.allow_crate_root]]
prefix = "modules/common/"
reason = """Shared definitions #[path]-mounted into every consumer; each uses a different subset, so no item is dead in all of them and none can carry #[expect]."""

[ci.test]
# Shadow-checkout hard-fail guard:
# tests/ and examples/ are shadow-tracked in .git-shadow/, so a checkout
# of the primary repo alone has zero files there and both the integration
# surface and the graphs it boots would be silently absent. The guard
# fails CI instead.
#
# Host-crate gate: quantum has no root Cargo workspace, so `fluxor ci`
# phase 2 is omitted and the tools/ crates are built, linted and tested
# by nothing. `tools/ci/host_crates.sh` closes that hole.
scripts = ["tools/ci/shadow_guard.sh", "tools/ci/host_crates.sh"]

[ci.templates]
# Quantum's graphs are concrete YAML (no __KEY__ placeholders today), so
# the template-render phase is a no-op pass over this directory. It is
# shadow-tracked; the guard above is what stops the phase passing on an
# empty tree.
dir = "examples"

[required]
# Wire-ABI pin enforced by `fluxor ci`'s version-skew phase. Bumps
# only when fluxor's `modules/sdk/wire/wire.rs::ABI_VERSION` changes
# (module headers / channel hints / contract ids break). The
# installed `fluxor` CLI must implement this exact ABI version.
fluxor = { abi = 1 }
