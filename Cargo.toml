# Quantum workspace — the operational surface is the modules/ tree, loaded
# at runtime by fluxor. This Cargo workspace exists to carry the lint
# baseline (per ~/Development/nanocloudio/standards/lints.md) and the
# host-side toolchain crates under tools/.

[workspace]
resolver = "2"
members  = [
    "crates/quantum-common",
    "tools/telemetry_guard",
    "tools/wire_lint",
    "tools/quantum-bench",
]

[workspace.package]
edition      = "2021"
rust-version = "1.81"            # reason = "..." attribute + #[expect]; see standards/lints.md
license      = "MIT OR Apache-2.0"

# Workspace lint baseline. Per standards/lints.md §1. Every member opts in
# with `[lints] workspace = true` in its own Cargo.toml.
[workspace.lints.rust]
unsafe_code               = "deny"     # no-unsafe crates escalate locally to "forbid" (lints.md §5)
unused_must_use           = "deny"
elided_lifetimes_in_paths = "warn"

[workspace.lints.clippy]
# priority = -1 makes the group enables apply before per-lint overrides.
all      = { level = "deny",  priority = -1 }
pedantic = { level = "warn",  priority = -1 }

# #[allow] discipline — bans bare #[allow] and requires reason = "...".
allow_attributes                = "deny"
allow_attributes_without_reason = "deny"

# Hardened defaults beyond clippy::all
dbg_macro     = "deny"
todo          = "warn"
unimplemented = "warn"
unwrap_used   = "deny"
expect_used   = "warn"
panic         = "warn"
print_stdout  = "deny"
print_stderr  = "deny"

# Pedantic carve-outs (universally noisy lints).
module_name_repetitions = "allow"
must_use_candidate      = "allow"
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"
missing_const_for_fn    = "allow"
too_many_lines          = "allow"
