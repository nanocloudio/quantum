[package]
name         = "telemetry_guard"
version      = "0.1.0"
edition      = "2021"
rust-version = "1.81"            # reason = "..." attribute + #[expect]; see standards/lints.md
license      = "MIT OR Apache-2.0"
publish      = false
description  = "Validates Quantum telemetry catalogs for basic structure"

[dependencies]
anyhow     = "1.0.95"
serde      = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

# Quantum has no root Cargo workspace (the deployable surface is modules/,
# and host crates stand alone under tools/), so the standards/lints.md §1
# baseline is inlined here rather than inherited. Keep in sync with the
# sibling tools; `tools/host_crates_e2e.sh` is what enforces it in CI.
[lints.rust]
unsafe_code               = "deny"
unused_must_use           = "deny"
elided_lifetimes_in_paths = "warn"

[lints.clippy]
# priority = -1 makes the group enables apply before per-lint overrides.
all      = { level = "deny",  priority = -1 }
pedantic = { level = "warn",  priority = -1 }

# #[allow] discipline — bans bare #[allow] and requires reason = "...".
allow_attributes                = "deny"
allow_attributes_without_reason = "deny"

# Hardened defaults beyond clippy::all
dbg_macro     = "deny"
todo          = "warn"
unimplemented = "warn"
unwrap_used   = "deny"
expect_used   = "warn"
panic         = "warn"
print_stdout  = "deny"
print_stderr  = "deny"

# Pedantic carve-outs (universally noisy lints).
module_name_repetitions = "allow"
must_use_candidate      = "allow"
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"
missing_const_for_fn    = "allow"
too_many_lines          = "allow"
